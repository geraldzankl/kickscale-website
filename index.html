<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://kickscale.com/">
  <meta http-equiv="refresh" content="0; url=https://kickscale.com/">
  <title>Kickscale — Redirecting</title>
  <script>
    if (/^(www\.)?kickscale\.si$/i.test(window.location.hostname)) {
      window.location.replace("https://kickscale.com/");
    }
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #030929; color: white; font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    a { color: #2BCCC5; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>We're moving to Kickscale.com</h1>
    <p>You'll be redirected automatically. If not, visit <a href="https://kickscale.com/">kickscale.com</a>.</p>
  </main>
</body>
</html>
